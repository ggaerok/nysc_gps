<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 GPS 좌표 보기</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8ecf8;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;padding:20px}
.card{width:100%;max-width:440px;background:#141b33;border:1px solid #243058;border-radius:18px;padding:26px}
h1{font-size:1.2rem;margin:0 0 14px}
p,li{line-height:1.6;color:#b8c2e0;font-size:.95rem}
ul{padding-left:20px;margin:10px 0 20px}
.btns{display:flex;gap:10px}
button{flex:1;padding:14px;border-radius:12px;border:0;font-size:1rem;font-weight:600;cursor:pointer}
.ok{background:#4f7cff;color:#fff}.no{background:#2a3358;color:#e8ecf8}
.row{background:#0b1020;border-radius:12px;padding:14px 16px;margin:10px 0}
.lbl{font-size:.8rem;color:#8d99c4}.val{font-size:1.5rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.sub{font-size:.8rem;color:#8d99c4;margin-top:2px}
.msg{color:#ffb4a8}.hide{display:none}
</style></head><body>
<main class="card">
  <section id="loading"><p>확인 중…</p></section>

  <section id="off" class="hide"><h1>운영 중이 아닙니다</h1><p>현재 이 페이지는 운영이 종료된 상태입니다.</p></section>

  <section id="consent" class="hide">
    <h1>GPS 좌표 보기 안내</h1>
    <p>이 페이지는 현재 사용 중인 기기의 위치(GPS)를 화면에 실시간으로 보여줍니다.</p>
    <ul>
      <li>위도·경도는 도·분·초(초는 소수 둘째 자리)로 표시됩니다.</li>
      <li>좌표는 이 기기의 화면에만 표시되며, 서버로 전송하거나 어디에도 저장하지 않습니다.</li>
      <li>[동의]를 누르면 브라우저가 위치 권한을 요청합니다.</li>
    </ul>
    <div class="btns"><button class="no" id="cancel">취소</button><button class="ok" id="agree">동의</button></div>
  </section>

  <section id="view" class="hide">
    <h1>현재 GPS 좌표</h1>
    <div class="row"><div class="lbl">위도 (Latitude)</div><div class="val" id="lat">–</div><div class="sub" id="latd"></div></div>
    <div class="row"><div class="lbl">경도 (Longitude)</div><div class="val" id="lon">–</div><div class="sub" id="lond"></div></div>
    <p class="sub" id="acc">위치 수신 대기 중…</p>
    <p class="msg" id="err"></p>
  </section>
</main>
<script src="dms.js"></script>
<script>
const $ = id => document.getElementById(id);
const show = id => ['loading','off','consent','view'].forEach(s => $(s).classList.toggle('hide', s !== id));
let watchId = null, poll = null, agreed = false;

async function running() {
  try { const r = await fetch('/api/status', {cache:'no-store'}); return (await r.json()).running === true; }
  catch { return false; }
}
function stopWatch() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }

function startWatch() {
  show('view');
  if (!navigator.geolocation) { $('err').textContent = '이 브라우저는 위치 기능을 지원하지 않습니다.'; return; }
  watchId = navigator.geolocation.watchPosition(pos => {
    const la = toDMS(pos.coords.latitude, true), lo = toDMS(pos.coords.longitude, false);
    $('lat').textContent = la.text; $('lon').textContent = lo.text;
    $('latd').textContent = pos.coords.latitude.toFixed(6) + '°';
    $('lond').textContent = pos.coords.longitude.toFixed(6) + '°';
    $('acc').textContent = '정확도 약 ' + Math.round(pos.coords.accuracy) + 'm · ' + new Date(pos.timestamp).toLocaleTimeString('ko-KR');
    $('err').textContent = '';
  }, e => {
    $('err').textContent = e.code === 1 ? '위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.'
      : e.code === 2 ? '위치를 확인할 수 없습니다.' : '위치 확인 시간이 초과되었습니다.';
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

// 관리페이지에서 운영이 종료되면 수신을 즉시 멈춥니다.
poll = setInterval(async () => {
  if (await running()) { if (agreed && watchId === null) startWatch(); }
  else { stopWatch(); show('off'); }
}, 10000);

$('agree').onclick = async () => {
  if (!(await running())) { show('off'); return; }
  agreed = true; startWatch();
};
$('cancel').onclick = () => { window.close(); setTimeout(() => { location.replace('about:blank'); }, 150); };

(async () => { show((await running()) ? 'consent' : 'off'); })();
</script></body></html>
