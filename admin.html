<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>GPS 보기 관리</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8ecf8;font-family:system-ui,"Malgun Gothic",sans-serif;padding:20px}
.card{width:100%;max-width:400px;background:#141b33;border:1px solid #243058;border-radius:18px;padding:26px}
h1{font-size:1.2rem;margin:0 0 16px}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #243058;font-size:1rem;margin-top:10px}
input{background:#0b1020;color:#e8ecf8}button{border:0;font-weight:600;cursor:pointer;color:#fff}
.go{background:#4f7cff}.start{background:#2e9b5f}.stop{background:#c8473d}.out{background:#2a3358}
.st{font-size:1.1rem;margin:6px 0 4px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.err{color:#ffb4a8;min-height:1.2em;margin-top:8px}.hide{display:none}
</style></head><body><main class="card">
<section id="login"><h1>관리자 로그인</h1>
<input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
<button class="go" id="enter">접속</button></section>
<section id="panel" class="hide"><h1>GPS 보기 운영 관리</h1>
<div class="st"><span class="dot" id="dot"></span><span id="state"></span></div>
<button class="start" id="start">운영 시작</button><button class="stop" id="stop">운영 종료</button>
<button class="out" id="logout">로그아웃</button></section>
<div class="err" id="err"></div>
</main>
<script>
const $=id=>document.getElementById(id);let pw='';
async function call(action){
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,action})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'오류');return j.running;
}
function render(on){$('state').textContent=on?'운영 중':'운영 종료됨';$('dot').style.background=on?'#2e9b5f':'#c8473d';
  $('start').disabled=on;$('stop').disabled=!on;$('start').style.opacity=on?.4:1;$('stop').style.opacity=on?1:.4}
async function act(a){$('err').textContent='';try{render(await call(a))}catch(e){$('err').textContent=e.message}}
$('enter').onclick=async()=>{pw=$('pw').value;$('err').textContent='';
  try{render(await call('status'));$('login').classList.add('hide');$('panel').classList.remove('hide')}catch(e){$('err').textContent=e.message;pw=''}};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
$('start').onclick=()=>act('start');$('stop').onclick=()=>act('stop');
$('logout').onclick=()=>{pw='';$('pw').value='';$('panel').classList.add('hide');$('login').classList.remove('hide')};
</script></body></html>
